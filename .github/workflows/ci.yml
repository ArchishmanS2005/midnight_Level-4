name: CI — AgentPassport

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build, Compile & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Install Compact compiler
        run: |
          curl -L https://midnight.network/downloads/compact-latest-linux.tar.gz | tar -xz -C /usr/local/bin
        continue-on-error: true  # Compact compiler may not be available in CI yet; continue to run tests

      - name: Compile Compact contract
        run: |
          if command -v compact &> /dev/null; then
            compact compile contracts/agentpassport.compact --output managed
            echo "✅ Compact contract compiled successfully"
          else
            echo "⚠️ Compact compiler not available in this environment — skipping compilation"
            echo "Run 'compact compile contracts/agentpassport.compact --output managed' locally"
          fi

      - name: Run tests
        run: npm run test:ci

      - name: Build frontend
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: agentpassport-dist
          path: dist/
          retention-days: 7
